name: "Terraform Plan PR Commenter"
description: "Composite action that converts terraform plan files to json and posts PR comments via liatrio/terraform-change-pr-commenter"

inputs:
  terraform-plan-filename:
    description: "name for terraform plan files"
    required: false
    default: "terraform.tfplan"
  use-automatic-binary-detection:
    description: "auto-detect terraform/terragrunt binary for conversion"
    required: false
    default: "true"
  enable-debug:
    description: "enable debug"
    required: false
    default: "false"
  include-plan-job-summary:
    description: "pass through to commenter"
    required: false
    default: "true"
  include-workflow-link:
    description: "Include a link to the workflow in the PR comment"
    required: false
    default: "true"
  pr-commenter-comment-header:
    description: "Header for the PR comment"
    required: false
    default: "Terraform Plan Changes"
  pr-commenter-comment-footer:
    description: "Footer for the PR comment"
    required: false
    default: ""
  continue-on-error:
    description: "Continue even if the commenter fails"
    required: false
    default: "true"
  hide-previous-comments:
    description: "Hide previous PR comments generated by this action"
    required: false
    default: "true"
  log-changed-resources:
    description: "Log changed resources in the PR comment"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for posting PR comments"
    required: false
    default: "${{ github.token }}"
  working-directory:
    description: "Working directory to run the action in"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Convert terraform plan files to json (script)
      id: tf-planfiles
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_TERRAFORM_PLAN_FILENAME: ${{ inputs.terraform-plan-filename }}
        INPUT_USE_AUTOMATIC_BINARY_DETECTION: ${{ inputs.use-automatic-binary-detection }}
        INPUT_ENABLE_DEBUG: ${{ inputs.enable-debug }}
      run: |
        bash "$GITHUB_ACTION_PATH/convert_plan_to_json.sh"
      # capture output in a step id for later use

    - name: Add PR comment for terraform plan changes
      if: steps.tf-planfiles.outputs.terraform_planfiles_json
      uses: liatrio/terraform-change-pr-commenter@c8ccafe4ce3ed9547b2d3517dde0f97be56893f8 #v1.14.2
      continue-on-error: ${{ inputs.continue-on-error }}
      with:
        include-plan-job-summary: ${{ inputs.include-plan-job-summary }}
        github-token: ${{ inputs.github-token }}
        include-workflow-link: ${{ inputs.include-workflow-link }}
        comment-header: ${{ inputs.pr-commenter-comment-header }}
        comment-footer: ${{ inputs.pr-commenter-comment-footer }}
        hide-previous-comments: ${{ inputs.hide-previous-comments }}
        log-changed-resources: ${{ inputs.log-changed-resources }}
        json-file: |
          ${{ steps.tf-planfiles.outputs.terraform_planfiles_json }}

outputs:
  terraform_planfiles_json:
    description: "Newline-separated list of generated tfplan json files"
    value: ${{ steps.tf-planfiles.outputs.terraform_planfiles_json }}
  plan_changes_summary:
    description: "JSON summary of planned resource changes across all plan files"
    value: ${{ steps.tf-planfiles.outputs.plan_changes_summary }}
  plan_changes_create:
    description: "Number of resources to create"
    value: ${{ steps.tf-planfiles.outputs.plan_changes_create }}
  plan_changes_update:
    description: "Number of resources to update"
    value: ${{ steps.tf-planfiles.outputs.plan_changes_update }}
  plan_changes_delete:
    description: "Number of resources to delete"
    value: ${{ steps.tf-planfiles.outputs.plan_changes_delete }}
  plan_changes_replace:
    description: "Number of resources to replace"
    value: ${{ steps.tf-planfiles.outputs.plan_changes_replace }}
  plan_changes_read:
    description: "Number of data sources to read"
    value: ${{ steps.tf-planfiles.outputs.plan_changes_read }}
  plan_changes_total:
    description: "Total planned changes, excluding data-source reads and no-op resources"
    value: ${{ steps.tf-planfiles.outputs.plan_changes_total }}
